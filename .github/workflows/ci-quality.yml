name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match local.lambda_runtime in infra/locals.tf
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 lambdas scripts

      - name: pytest
        run: pytest lambdas -q

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: terraform fmt
        run: terraform fmt -recursive -check -diff infra/

      - name: terraform validate
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

  grafana:
    name: Grafana dashboard JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard JSON
        run: python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('grafana/dashboards/*.json')]; print('ok')"
